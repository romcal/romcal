name: Pull Request
description: Submit a Pull Request
labels: ["change: feature request"]
assignees:
  - @romcal/romcal-contributors
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-should-happen
    attributes:
      label: What do you want to see happen?
      value: "I want something new!"
    validations:
      required: true
  - type: dropdown
    id: concept
    attributes:
      label: What concept does this feature request relate to?
      description: What part of the project does this feature request relate to?
      options:
        - Infrastructure
        - Localization
        - Calendar Definition
        - Discussion
        - Documentation
      default: 0
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: How would you like to use this feature?
      description: Please include a code sample for your usage.
      render: typescript
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](./CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

